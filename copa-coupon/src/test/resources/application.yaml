spring:
  datasource:
    url: jdbc:h2:mem:copa_coupon;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2를 사용한다. MySQL 전용 Flyway 마이그레이션 대신 Hibernate가 스키마를 생성한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# 테스트는 Kafka 브로커가 없으므로 선착순 발급 컨슈머(@KafkaListener)를 비활성화한다.
copa:
  # 테스트는 내부 인증 필터를 끈다(컨트롤러 테스트가 X-User-* 헤더를 직접 주입).
  security:
    enabled: false
  coupon:
    fcfs:
      consumer:
        enabled: false
