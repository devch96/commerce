server:
  port: 8086

spring:
  application:
    name: copa-coupon
  datasource:
    # auth(3306)·product(3307)·inventory(3308)·payment(3309)·order(3310)와 호스트 포트 충돌을 피하려 3311로 매핑한다.
    url: ${DB_URL:jdbc:mysql://localhost:3311/copa_coupon?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마는 Flyway 마이그레이션으로만 관리한다. Hibernate DDL 자동 생성은 사용하지 않는다.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 선착순 발급의 권위 데이터(재고·1인1매 집합). auth(6379)·product(6380)와 분리해 6381로 매핑.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
  # 선착순 발급 성공분을 coupon-issued 토픽으로 발행 → 컨슈머가 DB 반영(최종 일관성).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 유실 0을 위해 모든 ISR 확인 + 멱등 프로듀서.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${COUPON_ISSUED_GROUP_ID:copa-coupon-issued}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 선착순 쿠폰(Redis 원자 발급 + Kafka 비동기 DB 반영).
copa:
  coupon:
    fcfs:
      # 관리자가 오픈 시 수량을 생략하면 시드할 임시 발급 상한.
      default-quantity: 1000
      consumer:
        enabled: true
        group-id: copa-coupon-issued

# ── 관측성(Observability): actuator·메트릭·트레이싱 ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # HTTP 지연 히스토그램 버킷 발행(Grafana p95/p99 계산용).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      # 개발 단계는 전량 샘플링. 운영에서는 낮춰야 한다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
