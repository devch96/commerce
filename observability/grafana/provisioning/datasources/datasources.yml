# Grafana 기동 시 자동 등록되는 데이터소스: 메트릭(Prometheus)·트레이스(Zipkin).
# uid를 고정해 프로비저닝 대시보드가 데이터소스를 안정적으로 참조하도록 한다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://copa-prometheus:9090
    isDefault: true
    editable: true
  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://copa-zipkin:9411
    editable: true