# 각 서비스의 logstash-logback-encoder가 TCP 5000으로 보낸 JSON 로그를 받아 Elasticsearch로 적재한다.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # traceId가 있으면 Kibana에서 Zipkin 트레이스와 상호 참조하기 쉽도록 유지한다.
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "copa-logs-%{+YYYY.MM.dd}"
  }
  # 개발 편의를 위한 표준출력(디버깅). 필요 없으면 제거.
  stdout { codec => rubydebug }
}