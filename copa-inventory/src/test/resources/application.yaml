spring:
  datasource:
    url: jdbc:h2:mem:copa_inventory;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2를 사용한다. MySQL 전용 Flyway 마이그레이션 대신 Hibernate가 스키마를 생성한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  # 테스트는 브로커가 없으므로 Kafka 리스너 자동 기동을 막는다(컨텍스트 로딩만).
  kafka:
    listener:
      auto-startup: false
    consumer:
      group-id: copa-inventory-test
