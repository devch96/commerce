server:
  port: 8083

spring:
  application:
    name: copa-inventory
  datasource:
    # copa-auth-mysql(3306)·copa-product-mysql(3307)과 호스트 포트 충돌을 피하려 3308로 매핑한다.
    url: ${DB_URL:jdbc:mysql://localhost:3308/copa_inventory?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마는 Flyway 마이그레이션으로만 관리한다. Hibernate DDL 자동 생성은 사용하지 않는다.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: copa-inventory
      # 컨슈머 그룹이 처음 붙을 때 누락 없이 처음부터 소비(시드 이벤트 유실 방지).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
