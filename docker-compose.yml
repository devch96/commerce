# MSA 공통 인프라 (13주차 1일차 STEP2 - MSA 공통 준비)
# 회원·인증 서비스(copa-user)용 MySQL · Redis, 상품 서비스(copa-product)용 MySQL.
# Kafka(KRaft 단일 노드): 첫 이벤트 흐름은 상품 생성 → 재고 시드(copa-product outbox → copa-inventory consumer).

services:
  copa-auth-mysql:
    image: mysql:8.0
    container_name: copa-auth-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_auth
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-auth-redis:
    image: redis:7.2
    container_name: copa-auth-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - copa-auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-product-mysql:
    image: mysql:8.0
    container_name: copa-product-mysql
    # copa-auth-mysql(3306)과 호스트 포트 충돌을 피하려 3307로 매핑한다.
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_product
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-product-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-product-redis:
    image: redis:7.2
    container_name: copa-product-redis
    # copa-auth-redis(6379)와 호스트 포트 충돌을 피하려 6380으로 매핑한다. 상품 상세 조회 캐시 전용.
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - copa-product-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-inventory-mysql:
    image: mysql:8.0
    container_name: copa-inventory-mysql
    # copa-auth-mysql(3306)·copa-product-mysql(3307)과 호스트 포트 충돌을 피하려 3308로 매핑한다.
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_inventory
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-inventory-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-payment-mysql:
    image: mysql:8.0
    container_name: copa-payment-mysql
    # 호스트 포트 충돌을 피하려 3309로 매핑한다.
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_payment
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-payment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-order-mysql:
    image: mysql:8.0
    container_name: copa-order-mysql
    # 호스트 포트 충돌을 피하려 3310으로 매핑한다.
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_order
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-order-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-coupon-mysql:
    image: mysql:8.0
    container_name: copa-coupon-mysql
    # 호스트 포트 충돌을 피하려 3311로 매핑한다.
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_coupon
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-coupon-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka 브로커(KRaft 모드, 단일 노드). 서비스는 호스트에서 실행되므로 advertised listener를 localhost:9092로 둔다.
  copa-kafka:
    image: apache/kafka:3.8.1
    container_name: copa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: copa-kafka-cluster-00001
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  copa-auth-mysql-data:
  copa-auth-redis-data:
  copa-product-mysql-data:
  copa-product-redis-data:
  copa-inventory-mysql-data:
  copa-payment-mysql-data:
  copa-order-mysql-data:
  copa-coupon-mysql-data:
