# MSA 공통 인프라 (13주차 1일차 STEP2 - MSA 공통 준비)
# 회원·인증 서비스(copa-user)용 MySQL · Redis, 상품 서비스(copa-product)용 MySQL.
# Kafka는 주문 Saga 단계(15주차)에서 추가한다.

services:
  copa-auth-mysql:
    image: mysql:8.0
    container_name: copa-auth-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_auth
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-auth-redis:
    image: redis:7.2
    container_name: copa-auth-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - copa-auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-product-mysql:
    image: mysql:8.0
    container_name: copa-product-mysql
    # copa-auth-mysql(3306)과 호스트 포트 충돌을 피하려 3307로 매핑한다.
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_product
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-product-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-product-redis:
    image: redis:7.2
    container_name: copa-product-redis
    # copa-auth-redis(6379)와 호스트 포트 충돌을 피하려 6380으로 매핑한다. 상품 상세 조회 캐시 전용.
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - copa-product-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  copa-inventory-mysql:
    image: mysql:8.0
    container_name: copa-inventory-mysql
    # copa-auth-mysql(3306)·copa-product-mysql(3307)과 호스트 포트 충돌을 피하려 3308로 매핑한다.
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: copa_inventory
      MYSQL_USER: copa
      MYSQL_PASSWORD: copa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - copa-inventory-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  copa-auth-mysql-data:
  copa-auth-redis-data:
  copa-product-mysql-data:
  copa-product-redis-data:
  copa-inventory-mysql-data:
