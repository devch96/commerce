server:
  port: 8084

spring:
  application:
    name: copa-payment
  datasource:
    # 호스트 포트 충돌을 피하려 3309로 매핑한다(auth 3306·product 3307·inventory 3308).
    url: ${DB_URL:jdbc:mysql://localhost:3309/copa_payment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          tossPaymentClient: # FeignClient의 name과 일치해야 함
            connectTimeout: 3000 # 3초 (연결 타임아웃)
            readTimeout: 5000    # 5초 (응답 대기 타임아웃)
            loggerLevel: full
          kakaoPaymentClient:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: full

# 시크릿 키는 환경변수로 주입한다(리포지토리에 실 키 커밋 금지). 로컬 기본값은 더미.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_dummy}
kakao:
  secret-key: ${KAKAO_SECRET_KEY:DEV_KAKAO_DUMMY}

# 카카오 결제 설정. 리다이렉트 URL은 프론트 라우트로 두고, 프론트가 pg_token을 받아 confirm API를 호출한다.
payment:
  kakao:
    cid: ${KAKAO_CID:TC0ONETIME}
    approval-url: ${KAKAO_APPROVAL_URL:http://localhost:3000/payments/kakao/success}
    cancel-url: ${KAKAO_CANCEL_URL:http://localhost:3000/payments/kakao/cancel}
    fail-url: ${KAKAO_FAIL_URL:http://localhost:3000/payments/kakao/fail}


# ── 관측성(Observability): actuator·메트릭·트레이싱 ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # HTTP 지연 히스토그램 버킷 발행(Grafana p95/p99 계산용).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      # 개발 단계는 전량 샘플링. 운영에서는 낮춰야 한다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# 내부 인증 필터: 게이트웨이 신원 토큰 검증 + /internal 서비스 토큰 검증(운영 on).
copa:
  security:
    enabled: true
  # 신원/서비스 토큰 서명 검증용 공유 시크릿(게이트웨이와 동일 값이어야 한다).
  internal:
    secret: ${COPA_INTERNAL_SECRET:local-dev-internal-secret-please-change-this-to-a-256-bit-value}
