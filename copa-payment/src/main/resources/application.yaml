server:
  port: 8084

spring:
  application:
    name: copa-payment
  datasource:
    # 호스트 포트 충돌을 피하려 3309로 매핑한다(auth 3306·product 3307·inventory 3308).
    url: ${DB_URL:jdbc:mysql://localhost:3309/copa_payment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          tossPaymentClient: # FeignClient의 name과 일치해야 함
            connectTimeout: 3000 # 3초 (연결 타임아웃)
            readTimeout: 5000    # 5초 (응답 대기 타임아웃)
            loggerLevel: full

toss:
  secret-key: test_sk_xxxxxx # 개발자 센터에서 발급받은 시크릿 키

