plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta.copa'
version = '0.0.1-SNAPSHOT'
description = 'copa-order'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    set('springCloudVersion', '2025.0.0')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 서비스 간 동기 호출은 OpenFeign으로 한다(외부 API 호출 표준).
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // ── 관측성(Observability) ─────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-aop'      // AOP 메서드 로깅
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // /actuator (health, prometheus 등)
    implementation 'io.micrometer:micrometer-registry-prometheus'          // 메트릭 → Prometheus/Grafana
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'         // 분산 트레이싱(Micrometer→Brave)
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'             // 트레이스 Zipkin 전송
    implementation 'io.github.openfeign:feign-micrometer'                  // Feign 호출 트레이스 전파
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'     // JSON 로그 → Logstash(ELK)

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
