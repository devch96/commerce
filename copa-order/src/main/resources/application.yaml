server:
  port: 8085

spring:
  application:
    name: copa-order
  datasource:
    # 호스트 포트 충돌을 피하려 3310으로 매핑한다(auth 3306·product 3307·inventory 3308·payment 3309).
    url: ${DB_URL:jdbc:mysql://localhost:3310/copa_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 서비스 간 동기 호출 대상(내부 API). 게이트웨이를 거치지 않는다.
copa:
  clients:
    product: ${PRODUCT_URL:http://localhost:8082}
    inventory: ${INVENTORY_URL:http://localhost:8083}
    payment: ${PAYMENT_URL:http://localhost:8084}
    coupon: ${COUPON_URL:http://localhost:8086}

# 동기 Saga가 의존 서비스 지연에 무기한 블로킹되지 않도록 Feign 타임아웃을 명시한다(기본 60s는 위험).
feign:
  client:
    config:
      default:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT:2000}
        readTimeout: ${FEIGN_READ_TIMEOUT:5000}

# ── 관측성(Observability): actuator·메트릭·트레이싱 ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # HTTP 지연 히스토그램 버킷 발행(Grafana p95/p99 계산용).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      # 개발 단계는 전량 샘플링. 운영에서는 낮춰야 한다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
