spring:
  datasource:
    url: jdbc:h2:mem:copa_product;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2를 사용한다. MySQL 전용 Flyway 마이그레이션 대신 Hibernate가 스키마를 생성한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
    # 테스트에는 Elasticsearch가 없다. ES 리포지토리 스캔을 꺼서 시작 시 연결 시도를 막는다
    # (SimpleElasticsearchRepository 생성자가 클러스터에 연결하므로 컨텍스트 로드가 실패한다).
    elasticsearch:
      repositories:
        enabled: false

# 테스트는 브로커가 없으므로 outbox 릴레이와 검색 색인기(Kafka consumer)를 끈다.
copa:  # 테스트는 내부 인증 필터를 끈다. 컨트롤러 테스트가 X-User-* 헤더를 직접 주입하는 기존 방식을 유지.
  security:
    enabled: false
  outbox:
    relay:
      enabled: false
  search:
    indexer:
      enabled: false
