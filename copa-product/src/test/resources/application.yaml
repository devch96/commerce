spring:
  datasource:
    url: jdbc:h2:mem:copa_product;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2를 사용한다. MySQL 전용 Flyway 마이그레이션 대신 Hibernate가 스키마를 생성한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
