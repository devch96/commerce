server:
  port: 8082

spring:
  application:
    name: copa-product
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/copa_product?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마는 Flyway 마이그레이션으로만 관리한다. Hibernate DDL 자동 생성은 사용하지 않는다.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      # 상품 상세 조회 Look-Aside 캐시 전용. copa-auth-redis(6379)와 분리.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  # 상품 전문 검색·집계용 Elasticsearch(ELK 로그 클러스터와 동일 인스턴스 재사용).
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 유실 0을 위해 모든 ISR 확인 + 멱등 프로듀서.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # 검색 색인기 소비자. 새 그룹은 처음 시작 시 초기 오프셋부터 읽어 누락을 줄인다.
      group-id: ${SEARCH_INDEXER_GROUP_ID:copa-product-search-indexer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# outbox 릴레이: 미발행 이벤트를 폴링해 Kafka로 발행한다.
copa:
  outbox:
    relay:
      enabled: true
      poll-interval-ms: 2000
  # 검색 색인기(@KafkaListener): product-search-events 구독 → Elasticsearch upsert/delete.
  search:
    indexer:
      enabled: true

# ── 관측성(Observability): actuator·메트릭·트레이싱 ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # HTTP 지연 히스토그램 버킷 발행(Grafana p95/p99 계산용).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      # 개발 단계는 전량 샘플링. 운영에서는 낮춰야 한다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
