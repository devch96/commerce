server:
  port: 8082

spring:
  application:
    name: copa-product
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/copa_product?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:copa}
    password: ${DB_PASSWORD:copa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마는 Flyway 마이그레이션으로만 관리한다. Hibernate DDL 자동 생성은 사용하지 않는다.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      # 상품 상세 조회 Look-Aside 캐시 전용. copa-auth-redis(6379)와 분리.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
