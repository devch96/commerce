plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta.copa'
version = '0.0.1-SNAPSHOT'
description = 'copa-product'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Elasticsearch: 상품 전문 검색(통합 검색·집계). 색인은 Kafka product-search-events 구독으로 채운다.
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // QueryDSL: 목록/검색의 RDBMS 동적 쿼리(keyword·가격범위·카테고리·정렬 동적 조합).
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // 상품 생성·검색 색인 이벤트를 outbox 릴레이가 Kafka로 발행한다.
    implementation 'org.springframework.kafka:spring-kafka'

    // ── 관측성(Observability) ─────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-aop'      // AOP 메서드 로깅
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // /actuator (health, prometheus 등)
    implementation 'io.micrometer:micrometer-registry-prometheus'          // 메트릭 → Prometheus/Grafana
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'         // 분산 트레이싱(Micrometer→Brave)
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'             // 트레이스 Zipkin 전송
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'     // JSON 로그 → Logstash(ELK)

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
