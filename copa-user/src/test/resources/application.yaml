spring:
  datasource:
    url: jdbc:h2:mem:copa_auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2를 사용한다. MySQL 전용 Flyway 마이그레이션 대신 Hibernate가 스키마를 생성한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: copa-user-test-secret-key-must-be-at-least-256-bits-long-000000
  access-expiration-millis: 1800000
  refresh-expiration-millis: 1209600000
# 테스트는 내부 인증 필터를 끈다(컨트롤러 테스트가 X-User-* 헤더를 직접 주입).
copa:
  security:
    enabled: false
