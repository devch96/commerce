server:
  port: 8000

spring:
  application:
    name: copa-gateway

jwt:
  secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-shared-256-bit-key}

# 내부 신원/서비스 토큰 서명용 공유 시크릿(HS256). 게이트웨이가 신원 토큰을 발급하고
# 하위 서비스가 같은 시크릿으로 검증한다. 운영에서는 반드시 환경변수로 교체한다.
copa:
  internal:
    secret: ${COPA_INTERNAL_SECRET:local-dev-internal-secret-please-change-this-to-a-256-bit-value}

gateway:
  auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
  product-service-uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
  # 주문·결제는 인증 필요(화이트리스트에 없음). /internal/**은 게이트웨이를 거치지 않는다.
  order-service-uri: ${ORDER_SERVICE_URI:http://localhost:8085}
  payment-service-uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
  # 쿠폰 발급/조회·관리는 인증 필요(화이트리스트에 없음).
  coupon-service-uri: ${COUPON_SERVICE_URI:http://localhost:8086}
  # 선착순 예매. 이벤트 목록/상세만 공개하고 대기열·발권·취소는 인증 필요.
  ticket-service-uri: ${TICKET_SERVICE_URI:http://localhost:8087}
  # 'METHOD path' 형식이면 해당 메서드에만 공개, 경로만 적으면 모든 메서드에 공개한다.
  # 상품 조회는 비로그인 공개(인증은 주문 단계부터). 등록/수정/삭제(POST/PUT/DELETE)는
  # 인증을 거쳐 X-User-Role이 주입되고 copa-product에서 ADMIN 권한을 재검증한다.
  whitelist:
    - /auth/signup
    - /auth/login
    - /auth/reissue
    - GET /products
    - GET /products/**
    - GET /categories
    - GET /categories/**
    # 예매 이벤트 브라우징만 공개. GET /events/*는 한 세그먼트만 매칭하므로
    # /events/{id}/queue/** 등 하위 경로는 인증을 유지한다(AntPathMatcher).
    - GET /events
    - GET /events/*

# ── 관측성(Observability): actuator·메트릭·트레이싱 ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # HTTP 지연 히스토그램 버킷 발행(Grafana p95/p99 계산용).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      # 개발 단계는 전량 샘플링. 운영에서는 낮춰야 한다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
