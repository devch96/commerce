plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta.copa'
version = '0.0.1-SNAPSHOT'
description = 'copa-gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    set('springCloudVersion', '2025.0.0')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── 관측성(Observability) ─────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // /actuator (health, prometheus 등)
    implementation 'io.micrometer:micrometer-registry-prometheus'          // 메트릭 → Prometheus/Grafana
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'         // 분산 트레이싱(Micrometer→Brave)
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'             // 트레이스 Zipkin 전송
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'     // JSON 로그 → Logstash(ELK)

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
